<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans pb-10 transition-colors duration-300">
  <div class="max-w-4xl mx-auto px-4 py-8">
    
    <header class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-bold text-sky-500 dark:text-sky-400 flex items-center gap-2">
        <i class="fa-brands fa-github text-3xl"></i> GitHub Finder
      </h1>
      <button 
        id="theme-toggle" 
        class="flex items-center gap-2 bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-700 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors"
      >
        <i id="theme-icon" class="fa-solid fa-moon text-sky-500"></i>
        <span id="theme-text" class="text-sm font-medium">الوضع الداكن</span>
      </button>
    </header>

    <section class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-lg mb-6 border border-slate-200 dark:border-slate-700 transition-colors">
      <form id="search-form" class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input 
            type="text" 
            id="search-input" 
            placeholder="ابحث عن اسم المستخدم..." 
            class="w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-white rounded-lg border border-slate-300 dark:border-slate-700 focus:outline-none focus:border-sky-500 transition-colors"
          />
        </div>
        <button 
          type="submit" 
          class="bg-sky-500 hover:bg-sky-600 text-white font-medium px-6 py-3 rounded-lg transition-colors flex items-center justify-center gap-2"
        >
          <span>بحث</span>
        </button>
      </form>
    </section>

    <div id="loading" class="hidden text-center py-12">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-sky-500 border-t-transparent"></div>
      <p class="text-slate-400 mt-4">جاري جلب البيانات...</p>
    </div>

    <div id="error-message" class="hidden bg-red-500/10 border border-red-500/30 text-red-500 dark:text-red-400 p-4 rounded-xl text-center mb-6">
      <p id="error-text">المستخدم غير موجود!</p>
    </div>

    <main id="content-container">
      <div id="profile-card" class="bg-white dark:bg-slate-800 rounded-xl shadow-lg p-6 mb-8 border border-slate-200 dark:border-slate-700 transition-colors">
      </div>
      <section>
        <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-slate-700 dark:text-slate-200">
          <i class="fa-solid fa-code-branch text-sky-500 dark:text-sky-400"></i> أحدث المشاريع (Repositories)
        </h2>
        <div id="repos-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
